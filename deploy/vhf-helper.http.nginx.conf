server {
    listen 80;
    listen [::]:80;
    server_name vhf.p4e1.ru;

    root /var/www/vhf-helper;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vhf-helper;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
